<h2>Водонапірна вежа</h2>
<p>Водонапірна вежа — історична споруда на вулиці Косенка,24 (колиня вулиця Пушкінська) у місті Житомирі, споруджена 1898 року. Використовувалась як регулятор тиску води та пожежна оглядова вежа - каланча.</p>
